{% load static %}
<!-- Mobile App Bottom Navigation Bar (Visible only on Mobile & Small screens) -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg px-2 pt-2 pb-[max(0.5rem,env(safe-area-inset-bottom))] transition-transform">
  <div class="grid grid-cols-5 items-center max-w-lg mx-auto">
    <!-- 1. Home -->
    <a href="{% url 'home' %}" class="flex flex-col items-center justify-center py-1 group {% if request.path == '/' %}text-brand font-semibold{% else %}text-slate-500 hover:text-navy{% endif %}">
      <div class="relative p-1">
        <svg class="w-6 h-6 transition-transform group-active:scale-90" fill="{% if request.path == '/' %}currentColor{% else %}none{% endif %}" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="{% if request.path == '/' %}2.5{% else %}1.8{% endif %}" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
      </div>
      <span class="text-[11px] leading-tight mt-0.5">Home</span>
    </a>

    <!-- 2. Categories / Explore -->
    <a href="{% url 'collections' %}" class="flex flex-col items-center justify-center py-1 group {% if '/collections' in request.path or '/category/' in request.path %}text-brand font-semibold{% else %}text-slate-500 hover:text-navy{% endif %}">
      <div class="relative p-1">
        <svg class="w-6 h-6 transition-transform group-active:scale-90" fill="{% if '/collections' in request.path or '/category/' in request.path %}currentColor{% else %}none{% endif %}" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="{% if '/collections' in request.path or '/category/' in request.path %}2.5{% else %}1.8{% endif %}" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
        </svg>
      </div>
      <span class="text-[11px] leading-tight mt-0.5">Explore</span>
    </a>

    <!-- 3. Wishlist -->
    <a href="{% url 'wishlist' %}" class="flex flex-col items-center justify-center py-1 group relative {% if request.path == '/wishlist' %}text-brand font-semibold{% else %}text-slate-500 hover:text-navy{% endif %}">
      <div class="relative p-1">
        <svg class="w-6 h-6 transition-transform group-active:scale-90" fill="{% if request.path == '/wishlist' %}currentColor{% else %}none{% endif %}" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="{% if request.path == '/wishlist' %}2.5{% else %}1.8{% endif %}" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
        {% if wishlist_count and wishlist_count > 0 %}
          <span class="absolute -top-0.5 -right-1 bg-red-500 text-white text-[10px] font-bold rounded-full h-4 min-w-[16px] px-1 flex items-center justify-center shadow-sm">
            {{ wishlist_count }}
          </span>
        {% endif %}
      </div>
      <span class="text-[11px] leading-tight mt-0.5">Wishlist</span>
    </a>

    <!-- 4. Cart -->
    <a href="{% url 'cart' %}" class="flex flex-col items-center justify-center py-1 group relative {% if request.path == '/cart' or request.path == '/checkout' %}text-brand font-semibold{% else %}text-slate-500 hover:text-navy{% endif %}">
      <div class="relative p-1">
        <svg class="w-6 h-6 transition-transform group-active:scale-90" fill="{% if request.path == '/cart' or request.path == '/checkout' %}currentColor{% else %}none{% endif %}" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="{% if request.path == '/cart' or request.path == '/checkout' %}2.5{% else %}1.8{% endif %}" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        {% if cart_count and cart_count > 0 %}
          <span class="absolute -top-0.5 -right-1 bg-brand text-white text-[10px] font-bold rounded-full h-4 min-w-[16px] px-1 flex items-center justify-center shadow-sm">
            {{ cart_count }}
          </span>
        {% endif %}
      </div>
      <span class="text-[11px] leading-tight mt-0.5">Cart</span>
    </a>

    <!-- 5. Account / Orders -->
    {% if request.user.is_authenticated %}
      <a href="{% url 'my_orders' %}" class="flex flex-col items-center justify-center py-1 group {% if '/orders' in request.path %}text-brand font-semibold{% else %}text-slate-500 hover:text-navy{% endif %}">
        <div class="relative p-1">
          <svg class="w-6 h-6 transition-transform group-active:scale-90" fill="{% if '/orders' in request.path %}currentColor{% else %}none{% endif %}" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="{% if '/orders' in request.path %}2.5{% else %}1.8{% endif %}" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <span class="text-[11px] leading-tight mt-0.5">Account</span>
      </a>
    {% else %}
      <a href="{% url 'login' %}" class="flex flex-col items-center justify-center py-1 group {% if request.path == '/login' or request.path == '/register' %}text-brand font-semibold{% else %}text-slate-500 hover:text-navy{% endif %}">
        <div class="relative p-1">
          <svg class="w-6 h-6 transition-transform group-active:scale-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
        </div>
        <span class="text-[11px] leading-tight mt-0.5">Login</span>
      </a>
    {% endif %}
  </div>
</nav>
