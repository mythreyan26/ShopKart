{% if messages %}
<!-- Floating Modern Toast Notifications Container -->
<div class="fixed top-20 right-4 sm:right-6 z-50 space-y-2.5 max-w-md w-full pointer-events-none px-2 sm:px-0" x-data>
  {% for message in messages %}
  <div x-data="{ show: true }"
       x-show="show"
       x-init="setTimeout(() => show = false, 4000)"
       x-transition:enter="transition ease-out duration-300 transform"
       x-transition:enter-start="opacity-0 translate-y-2 scale-95"
       x-transition:enter-end="opacity-100 translate-y-0 scale-100"
       x-transition:leave="transition ease-in duration-200 transform"
       x-transition:leave-start="opacity-100 translate-y-0 scale-100"
       x-transition:leave-end="opacity-0 translate-y-2 scale-95"
       class="pointer-events-auto rounded-2xl p-4 shadow-xl border backdrop-blur-md flex items-center justify-between gap-3 text-sm
         {% if message.tags == 'success' %} bg-emerald-950/90 text-emerald-100 border-emerald-700/60
         {% elif message.tags == 'error' %} bg-rose-950/90 text-rose-100 border-rose-700/60
         {% elif message.tags == 'warning' %} bg-amber-950/90 text-amber-100 border-amber-700/60
         {% else %} bg-slate-900/90 text-slate-100 border-slate-700/60 {% endif %}">
    
    <div class="flex items-center gap-3">
      <span class="text-lg">
        {% if message.tags == 'success' %}✨
        {% elif message.tags == 'error' %}⚠️
        {% elif message.tags == 'warning' %}💡
        {% else %}ℹ️{% endif %}
      </span>
      <p class="font-semibold text-xs sm:text-sm leading-snug">{{ message }}</p>
    </div>
    
    <button @click="show = false" class="p-1 text-slate-400 hover:text-white rounded-lg transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}
